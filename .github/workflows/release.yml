name: Build & Release Multiplatform Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. ANDROID BUILD (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Android NDK
        run: |
          NDK_DIR=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
            echo "Using Android NDK: $NDK_DIR"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Universal Release APK
        run: flutter build apk --release

      - name: Package Universal APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Dartotsu-Android-universal.apk

      - name: Build Android ARM64 Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Package ARM64 APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Dartotsu-Android-arm64.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dartotsu-Android-APKs
          path: Dartotsu-Android-*.apk

  # ==========================================
  # 2. LINUX BUILD
  # ==========================================
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev liblzma-dev libwpewebkit-1.0-dev libwpebackend-fdo-1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: tar -czvf Dartotsu-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dartotsu-Linux-x64
          path: Dartotsu-Linux-x64.tar.gz

  # ==========================================
  # 3. WINDOWS BUILD
  # ==========================================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Package Windows Bundle (ZIP)
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Dartotsu-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dartotsu-Windows-x64
          path: Dartotsu-Windows-x64.zip

  # ==========================================
  # 4. IOS BUILD
  # ==========================================
  build-ios:
    name: Build iOS Bundle
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Runner
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../Dartotsu-iOS-unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dartotsu-iOS-unsigned
          path: Dartotsu-iOS-unsigned.ipa

  # ==========================================
  # 5. PUBLISH GITHUB RELEASE
  # ==========================================
  release:
    name: Publish GitHub Release
    if: always()
    needs: [build-android, build-linux, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-artifacts

      - name: Flatten artifact folder structure
        run: |
          mkdir -p dist
          if [ -d "release-artifacts" ]; then
            find release-artifacts -type f -exec cp {} dist/ \;
          fi
          ls -la dist/

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
